# Tarjomeh CI — runs the full test suite on every push.
# (Replaces a stock template that declared a 'test' stage with no jobs,
#  which made every pipeline fail with "0 failed jobs".)

stages:
  - test

run-tests:
  stage: test
  image: python:3.11-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - pip install --quiet -e .[dev]
  script:
    - python -m compileall -q src/
    - python -m pytest tests/ -q
  rules:
    - if: $CI_COMMIT_BRANCH

# Optional: GitLab secret scanning (creates its own job when available).
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
