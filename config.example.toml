# =============================================================================
# Tarjomeh (ترجمه) Configuration
# =============================================================================
# HOW TO USE THIS FILE
#   1. Copy it:            cp config.example.toml config.toml
#   2. Put your API KEYS in the .env file (NOT here — see .env.example).
#   3. Pick ONE of the scenarios below (A, B, or C) and set [llm] + [llm.critic]
#      accordingly. Everything else can stay at its default.
#
# WHERE REQUESTS GO (api_base resolution order):
#   [llm.openrouter] api_base  →  OPENROUTER_API_BASE env var  →  openrouter.ai
#
# -----------------------------------------------------------------------------
# SCENARIO A — Everything via OpenRouter directly (simplest)
#   .env:        OPENROUTER_API_KEY=sk-or-...   (and REMOVE/blank OPENROUTER_API_BASE)
#   [llm]        model = "deepseek/deepseek-v4-flash"
#   [llm.openrouter] api_base = "https://openrouter.ai/api/v1"
#   [llm.critic] enabled = true, model = "anthropic/claude-sonnet-5"
#   → OpenRouter automatically falls back between providers for each model.
#
# SCENARIO B — Everything via 9router (9router handles fallback combos)
#   .env:        OPENROUTER_API_KEY=<the key your 9router accepts>
#                OPENROUTER_API_BASE=http://172.17.0.1:20128/v1
#   [llm]        model = "combo1"          (a combo you defined in 9router)
#   [llm.openrouter] api_base = ""          (inherits the env var above)
#   [llm.critic] enabled = true, model = "combo2"   (a second 9router combo)
#
# SCENARIO C — MIXED: cheap translator via 9router + strong judge via OpenRouter  ⭐
#   .env:        OPENROUTER_API_KEY=<9router key>
#                CRITIC_API_KEY=sk-or-...   (your real OpenRouter key)
#   [llm]        model = "combo1"
#   [llm.openrouter] api_base = "http://172.17.0.1:20128/v1"
#   [llm.critic] enabled   = true
#                model     = "anthropic/claude-sonnet-5"
#                api_base  = "https://openrouter.ai/api/v1"
#                api_keys  = ["${CRITIC_API_KEY}"]
#   (The reverse also works: translator via OpenRouter, judge via 9router —
#    just swap the api_base values.)
# =============================================================================

[llm]
provider = "openrouter"          # "openrouter" (any OpenAI-compatible endpoint,
                                 #  incl. 9router) | "ollama" (local models)
# TRANSLATOR model. An OpenRouter model id (e.g. "deepseek/deepseek-v4-flash",
# "anthropic/claude-sonnet-5") or a 9router combo name (e.g. "combo1").
model = "deepseek/deepseek-v4-flash"
temperature = 0.3
# Output budget PER REQUEST. Keep at 8192+: reasoning models spend hidden
# "thinking" tokens from this budget, and 4096 caused truncated/empty
# translations. The client auto-doubles it (up to 32000) if a completion
# is still cut off.
max_tokens = 8192

[llm.openrouter]
# API keys live in .env — referenced here as ${VAR}. For key rotation list
# several: api_keys = ["${OPENROUTER_API_KEY}", "${OPENROUTER_API_KEY_2}"]
api_keys = ["${OPENROUTER_API_KEY}"]
site_url = "https://tarjomeh.local"
app_name = "Tarjomeh"
# Endpoint for the TRANSLATOR.
#   ""                                = use OPENROUTER_API_BASE env var,
#                                       else https://openrouter.ai/api/v1
#   "https://openrouter.ai/api/v1"    = force OpenRouter directly
#   "http://172.17.0.1:20128/v1"      = 9router on the same VPS (Docker host IP)
api_base = ""

[llm.ollama]
host = "http://localhost:11434"
model = "llama3.1:70b"

[llm.critic]
# INDEPENDENT JUDGE for self-critique and back-translation QA. A separate,
# stronger model grading the translation removes the blind spots of a model
# scoring its own output. Active when enabled = true OR model is set.
# ⚠ Never use a free/congested model as the judge — the critique loop
#   multiplies calls and a flaky judge poisons refinement.
enabled = false
provider = ""                    # "" = inherit [llm] provider
model = ""                       # e.g. "anthropic/claude-sonnet-5" or "combo2"
api_keys = []                    # [] = inherit keys above; or ["${CRITIC_API_KEY}"]
api_base = ""                    # "" = inherit translator endpoint; or set a
                                 # DIFFERENT one (see Scenario C)
temperature = 0.0                # judges should be near-deterministic

[translation]
source_lang = "English"
target_lang = "Persian (Farsi)"
country = "Iran"                 # dialect: "Iran" (فارسی) vs "Afghanistan" (دری)
mode = "academic"                # "fast" (draft) | "quality" | "academic" (best)
style_register = "academic"      # "academic" | "literary" | "general"
domain = "political theory, sociology, philosophy"
enable_critique = true           # auto-set by mode, overridable
enable_back_translation = true   # auto-set by mode, overridable
back_translation_sample_pct = 20 # auto-set by mode: fast=0, quality=5, academic=20
enable_web_context = true        # web search for ambiguous-term disambiguation
parallel_workers = 1             # >1 only in fast/quality; academic is always 1
critique_threshold = 7.0         # refine chunks scoring below this (1-10)

[chunking]
strategy = "semantic"            # "semantic" | "fixed"
max_chunk_tokens = 1000          # auto-set by mode: fast=3000, quality=1500, academic=1000
overlap_sentences = 2

[glossary]
path = "glossary/academic_political_theory.csv"
# Optional extra CSVs loaded after the primary glossary above. Old single-file
# configs keep working; use this when you want namespaced/domain glossaries.
# Example:
# paths = [
#   "glossary/analytic_philosophy.csv",
#   "glossary/ethics.csv",
#   "glossary/ancient_medieval_philosophy.csv",
#   "glossary/islamic_philosophy.csv",
# ]
paths = []
enable_auto_extraction = true
enable_compliance_check = true
enable_auto_correction = true

[output]
format = "docx"                  # "pdf" | "epub" | "docx" | "txt" | "srt"
bilingual_mode = "inline"        # "inline" (EN+FA) | "side_by_side" | "target_only"

[persian]
convert_numerals = true
normalize_zwnj = true
fix_punctuation = true
# Shields scholarly apparatus — citations, years, page numbers, footnote
# markers — from numeral/punctuation conversion: (Marx 1973, 408) stays
# exactly as-is. Keep true for academic books.
scholarly_mode = true
font_family = "Vazirmatn"

[memory]
enable_4layer = true
summary_update_interval = "chapter"
long_term_retrieval_k = 5
short_term_window = 4

[pdf]
parser_backend = "pymupdf"       # "pymupdf" | "doclayout-yolo"
enable_ocr = false

[retry]
max_retries = 5
base_delay = 1.0
max_delay = 60.0
jitter = true
max_consecutive_errors = 3       # pause the job after N consecutive chunk failures

[notifications]
webhook_url = ""                 # Telegram bot, ntfy.sh, Discord, Slack — any POST endpoint
notify_on_complete = true
notify_on_error = true

[server]
host = "127.0.0.1"              # bind to localhost (access via SSH tunnel);
                                 # Docker overrides this via the serve command
port = 8080
