# Tarjomeh v9.5 configuration template
#
# 1. Copy this file to config.toml.
# 2. Keep API keys and UI secrets in .env.
# 3. Use the Web UI for per-job overrides.
#
# Configuration precedence:
# built-in defaults -> config.toml -> .env overrides -> CLI/Web UI overrides.

[llm]
# "openrouter" means any OpenAI-compatible endpoint, including 9router.
# Use "ollama" only with the [llm.ollama] block below.
provider = "openrouter"
model = "deepseek/deepseek-v4-flash"
temperature = 0.3

# Output budget for the unchanged normal request.
max_tokens = 12000

[llm.recovery]
# Predictive first-attempt sizing plus bounded recovery. Prompts, reasoning,
# model selection, and quality behavior are not changed by predictive sizing.
enabled = true
# Normal + calculated same-model retry. A configured fallback adds one final rung.
max_attempts = 2
model = ""
reasoning_effort = "low"
# Legacy/final recovery allowance used by non-adaptive compatibility paths.
max_tokens = 24000
# Estimate enough answer/reasoning room before Attempt 1. Reserved tokens are a
# ceiling; providers normally bill only tokens actually generated.
predictive_first_attempt = true
# First attempts never fall below this allowance when context capacity permits.
predictive_min_tokens = 50000
bootstrap_reasoning_tokens = 24000
# Absolute adaptive output ceiling and model context-window guardrail. Override
# context_window_tokens when the configured model has a smaller context window.
adaptive_max_tokens = 65536
context_window_tokens = 131072
context_safety_tokens = 2048
# Cap the diagnostic sample counter; the high-water mark never decays.
history_window = 20
expanded_final_attempt = false
final_reasoning_effort = "none"

[llm.openrouter]
# For one key, normally use TRANSLATOR_API_KEY in .env.
# For rotation, define named variables in .env and list them here:
# api_keys = [
#   "${OPENROUTER_TRANSLATOR_KEY_1}",
#   "${OPENROUTER_TRANSLATOR_KEY_2}",
# ]
api_keys = ["${OPENROUTER_API_KEY}"]
site_url = "https://tarjomeh.local"
app_name = "Tarjomeh"

# Empty resolves through OPENROUTER_API_BASE and then OpenRouter.
# Direct OpenRouter: https://openrouter.ai/api/v1
# Example 9router: http://172.17.0.1:20128/v1
api_base = ""
exclude_reasoning = true

[llm.ollama]
host = "http://localhost:11434"
model = "llama3.1:70b"

[llm.critic]
# A separate critic is recommended for academic translation.
# It is active when enabled=true or model is non-empty.
# Blank provider/key/base values inherit from the translator.
enabled = false
provider = ""
model = ""
api_keys = []
api_base = ""
temperature = 0.0

# Critic-specific bounded recovery.
recovery_model = ""
recovery_max_attempts = 4
recovery_max_tokens = 50000

[translation]
source_lang = "English"
target_lang = "Persian (Farsi)"
country = "Iran"

# fast | quality | academic
mode = "academic"

# academic | literary | general
style_register = "academic"
domain = "political theory, sociology, philosophy"

enable_critique = true
max_refine_iterations = 2
critique_threshold = 9.0

enable_back_translation = true
back_translation_sample_pct = 20

enable_web_context = true
enable_book_research = false

# Optional chapter controls. Positions are the 1-based order reported by the
# Web UI chapter detector. Empty/zero values preserve whole-book behavior.
chapter_selection = []
stop_after_chapter = 0
pause_after_each_chapter = false

# Academic mode always forces sequential operation.
parallel_workers = 1

# Reject lossy refinements, glossary repairs, and manual retranslations.
enable_integrity_gate = true
integrity_min_retention_ratio = 0.65
integrity_max_growth_ratio = 1.75

# Bounded schema-repair calls for critic/refiner JSON.
qa_json_retries = 1

[web_search]
# auto | tavily | brave | google | duckduckgo
provider = "auto"
fallback_providers = ["brave", "google", "duckduckgo"]
max_results = 5
timeout_seconds = 15
max_retries = 2

# Phase 7 and per-chunk search budgets.
phase7_max_queries = 8
max_queries_per_chunk = 2
max_queries_per_book = 100

[chunking]
# semantic | fixed
strategy = "semantic"
max_chunk_tokens = 1000
overlap_sentences = 2

[glossary]
# The primary glossary has highest precedence.
path = "glossary/academic_political_theory.csv"

# Optional additional context/domain glossaries:
# paths = [
#   "glossary/analytic_philosophy.csv",
#   "glossary/islamic_philosophy.csv",
# ]
paths = []

enable_auto_extraction = true
enable_compliance_check = true
enable_auto_correction = true

[output]
# pdf | epub | docx | markdown | txt | srt
format = "docx"

# inline | side_by_side | target_only
bilingual_mode = "inline"

# inline | footnote | endnote | both
term_notes = "inline"

[persian]
convert_numerals = true
normalize_zwnj = true
fix_punctuation = true

# Preserve citations, years, page numbers, and footnote markers.
scholarly_mode = true
font_family = "Vazirmatn"

[memory]
enable_4layer = true
summary_update_interval = "chapter"
long_term_retrieval_k = 5
short_term_window = 4

[pdf]
# pymupdf | doclayout-yolo
parser_backend = "pymupdf"
enable_ocr = false

[retry]
max_retries = 5
base_delay = 1.0
max_delay = 60.0
jitter = true
max_consecutive_errors = 3

# Sequential academic jobs pause on the first genuine chunk-stage failure so
# later chunks cannot advance without the failed chunk's memory.
pause_on_sequential_error = true

[notifications]
webhook_url = ""
notify_on_complete = true
notify_on_error = true

[server]
# Docker overrides these with the serve command in Dockerfile.
host = "127.0.0.1"
port = 8080

[system_prompt]
# Empty uses Tarjomeh's built-in prompt.
template = ""
