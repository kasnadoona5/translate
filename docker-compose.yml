services:
  tarjomeh:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./jobs:/app/jobs
      - ./glossary:/app/glossary
      - ./output:/app/output
      - ./config.toml:/app/config.toml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
