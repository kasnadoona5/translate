[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tarjomeh"
version = "0.1.0"
description = "Professional academic book translation system (English → Persian)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    {name = "Tarjomeh Contributors"},
]
keywords = ["translation", "persian", "farsi", "academic", "nlp", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Persian",
]

dependencies = [
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "ebooklib>=0.18",
    "reportlab>=4.1",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.0",
    "flask>=3.0.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "hazm>=0.10.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
pdf-layout = [
    "doclayout-yolo>=0.0.1",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
ocr = [
    "ocrmypdf>=16.0.0",
]
langgraph = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
all = [
    "tarjomeh[pdf-layout,ocr,langgraph,dev]",
]

[project.scripts]
tarjomeh = "tarjomeh.cli.main:main"

[project.urls]
Homepage = "https://github.com/tarjomeh/tarjomeh"
Repository = "https://github.com/tarjomeh/tarjomeh"
Issues = "https://github.com/tarjomeh/tarjomeh/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
